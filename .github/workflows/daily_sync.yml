name: Autonomous Daily Hardware Catalog & TR Price Sync

on:
  schedule:
    # Her gün Türkiye saatiyle 03:20 (UTC 00:20 - GitHub Actions 00:00 tepe yük kuyruk gecikmesini engellemek için)
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hardware-sync
  cancel-in-progress: false

jobs:
  autonomous-daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Autonomous Hardware Discovery & Missing Brands Ingestion (DevSecOps)
        run: |
          python scripts/autonomous_hardware_discovery.py

      - name: 2. Sync Deep Hardware Specs & 12-Game FPS Benchmarks
        run: |
          python scripts/sync_deep_specs_and_benchmarks.py

      - name: 3. Sync Global Technical Catalog & Multi-Angle Peripherals
        run: |
          python scripts/sync_global_catalog.py

      - name: 4. Check TR Store Price Changes & Stock Status
        run: |
          python scripts/update_prices.py

      - name: 5. Autonomous OEM Prebuilt Systems & Gaming Laptops Scraper
        run: |
          python scripts/sync_systems_and_laptops.py

      - name: 6. Final Dual Directory Catalog Verification & Hash Integrity
        run: |
          python scripts/autonomous_hardware_discovery.py

      - name: Commit and push only if real data changes exist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff -I '"lastUpdated":' --quiet data/ shared/src/commonMain/composeResources/files/; then
            echo "Gerçek veri değişikliği yok (yalnızca zaman damgası). Commit atlanıyor."
            git checkout -- data/ shared/src/commonMain/composeResources/files/
          else
            git add data/ shared/src/commonMain/composeResources/files/
            git commit -m "chore(catalog): autonomous daily hardware catalog & TR prices sync [skip ci]"
            git push
          fi
