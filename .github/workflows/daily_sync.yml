name: Autonomous Daily Hardware Catalog & TR Price Sync

on:
  schedule:
    # Her gün Türkiye saatiyle 03:20 (UTC 00:20 - GitHub Actions 00:00 tepe yük kuyruk gecikmesini engellemek için)
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hardware-sync
  cancel-in-progress: false

jobs:
  autonomous-daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENABLE_PRICE_SYNC: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore crawler checkpoint cache (scripts/cache)
        uses: actions/cache@v4
        with:
          path: scripts/cache
          key: crawler-state-${{ github.run_id }}
          restore-keys: |
            crawler-state-

      - name: 1. Multi-Source Checkpointed Crawler (Delta Mode)
        run: |
          python -m scripts.crawlers.run_crawl --mode delta --gsmarena-limit 15

      - name: 2. Merge Multi-Source Catalogs & Verify Provenance
        run: |
          python -m scripts.crawlers.merge_and_build

      - name: 3. Check TR Store Price Changes & Stock Status
        if: env.ENABLE_PRICE_SYNC == 'true'
        run: |
          python scripts/update_prices.py

      - name: 4. Conditional Room v36 SQLite DB Rebuild
        run: |
          if [ -n "$(git status --porcelain data/ shared/src/commonMain/composeResources/files/)" ]; then
            echo "Yeni donanım veya özellik değişikliği tespit edildi; hardware_wizard.db güncelleniyor..."
            python scripts/prepare_prepopulated_db.py
          else
            echo "Katalogda yeni ürün veya özellik değişikliği yok; Room DB yenilemesi atlanıyor."
          fi

      - name: Commit and push only if real data changes exist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff -I '"lastUpdated":\|"verifiedAt":\|"spec_verified_at":' --quiet data/ shared/src/commonMain/composeResources/files/ androidApp/src/main/assets/databases/; then
            echo "Gerçek veri değişikliği yok (yalnızca zaman damgası). Commit atlanıyor."
            git checkout -- data/ shared/src/commonMain/composeResources/files/ androidApp/src/main/assets/databases/
          else
            git add data/ shared/src/commonMain/composeResources/files/ androidApp/src/main/assets/databases/
            git commit -m "chore(catalog): autonomous daily multi-source delta catalog sync [skip ci]"
            git push
          fi
