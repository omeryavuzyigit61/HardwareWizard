name: Autonomous Daily Hardware Delta Sync (Supabase)

on:
  schedule:
    # Her gün Türkiye saatiyle 03:20 (UTC 00:20) — Yalnızca yeni çıkan ürünleri tespit edip Supabase'e ekler.
    # Git deposuna her gün gereksiz 50 MB JSON/SQLite commit'i atmaz!
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      gsmarena_limit:
        description: 'Maksimum GSMArena cihaz sayfası (anti-bot güvenli limit)'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: daily-hardware-delta-sync
  cancel-in-progress: false

jobs:
  supabase-delta-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Delta-Only New Hardware Discovery -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/supabase_catalog_sync.py \
            --action delta \
            --gsmarena-limit "${{ github.event.inputs.gsmarena_limit || '10' }}"
