name: Daily Turkey Hardware Price & Deep Spec Tracker

on:
  # Not: Otomatik günlük çalışma 'daily_sync.yml' üzerinden tek bir boru hattında birleştirilmiştir.
  # Bu iş akışı ihtiyaç halinde GitHub Actions arayüzünden manuel olarak (workflow_dispatch) tetiklenebilir.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hardware-sync
  cancel-in-progress: false

jobs:
  update-prices-and-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Restore HTTP ETag & Incremental Crawl Cache
        uses: actions/cache@v4
        with:
          path: data/.http_cache.json
          key: http-etag-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            http-etag-cache-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Sync Deep Hardware Specs & 12-Game FPS Benchmarks
        run: |
          python scripts/sync_deep_specs_and_benchmarks.py

      - name: 2. Run Autonomous Anti-Ban Multi-Store Price Scraper
        run: |
          python scripts/update_prices.py

      - name: 3. Sync OEM Prebuilt Systems & Gaming Laptops
        run: |
          python scripts/sync_systems_and_laptops.py

      - name: Commit and push only if real price or spec changes exist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff -I '"lastUpdated":' --quiet data/ shared/src/commonMain/composeResources/files/; then
            echo "Gerçek fiyat veya teknik veri değişikliği yok (yalnızca zaman damgası). Commit atlanıyor."
            git checkout -- data/ shared/src/commonMain/composeResources/files/
          else
            git add data/ shared/src/commonMain/composeResources/files/
            git commit -m "chore(catalog): autonomous deep specs, 12-game benchmarks & TR store prices sync [skip ci]"
            git push
          fi
