name: Daily Turkey Hardware Price Tracker

on:
  schedule:
    # Her gece Türkiye saatiyle 03:00 (UTC 00:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Run price tracking script
        run: |
          python scripts/update_prices.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices_tr.json shared/src/commonMain/composeResources/files/prices_tr.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(prices): daily update Turkish hardware prices [skip ci]" && git push)
